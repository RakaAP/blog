# Spring Application Configuration
spring.application.name=blog
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/personalBlog
spring.datasource.username=admin
spring.datasource.password=Admin*123
spring.datasource.driver-class-name=org.postgresql.Driver

# Database Schema & Migration Configuration (PostgreSQL Single Source of Truth)
# Nonaktifkan auto-migration & auto-DDL saat startup agar tidak ada modifikasi otomatis ke database
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Logging
logging.level.org.hibernate.SQL=info
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=info

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true
info.app.name=Personal Blog API
info.app.version=1.0.0
info.app.description=Personal Blog & Portfolio Backend powered by Spring Boot 4 + PostgreSQL

# SpringDoc OpenAPI / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Multipart File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
server.tomcat.max-http-form-post-size=15MB
server.tomcat.max-swallow-size=-1