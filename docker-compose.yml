services:
  postgres:
    image: postgres:16-alpine
    container_name: personal_blog_db
    restart: always
    environment:
      POSTGRES_DB: personalBlog
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Admin*123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
